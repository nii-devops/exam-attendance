{% extends "base.html" %}
{% from 'bootstrap5/form.html' import render_form %}

{% block title %}
    {{title}}
{% endblock title %}

{% block styles %}
<!-- Add Select2 styles if needed -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
{% endblock styles %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100 my-5">
    <div style="max-width: 600px;" class="login-card col-lg-4 col-md-6 col-sm-10">
            <div class="login-form">
                <div class="text-center mb-4">
                    <h3 class="heading fw-bold">{{heading}}</h3>
                    <hr class="my-4">
                </div>
                
               <div>
                    {{ render_form(form) }}
               </div>
               
            </div>
    </div>
</div>
{% endblock content %}

{% block scripts %}
<!-- jQuery (required by Select2 and for AJAX) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<!-- Select2 JS if you're using it -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>


<script>
$(document).ready(function() {
    // Initialize Select2 if needed
    $('#course_field, #programmes_field, #venues_field').select2({
        theme: "bootstrap-5",
        placeholder: "Select...",
        allowClear: true
    });

    // Function to update sessions based on selected date
    function updateSessions(date) {
        var sessionSelect = $('#session_field');
        sessionSelect.prop('disabled', true).empty();

        $.getJSON('/get_sessions', { date: date })
            .done(function(response) {
            if (response.length) {
                $.each(response, function(_, sess) {
                sessionSelect.append(
                    $('<option>')
                    .val(sess.id)
                    .text(sess.date + (sess.start_time ? ' – ' + sess.start_time : ''))
                );
                });
            } else {
                sessionSelect.append(
                $('<option>').val('').text('No sessions available for this date')
                );
            }
            })
            .fail(function(xhr) {
            console.error('Error fetching sessions:', xhr.responseJSON || xhr.statusText);
            sessionSelect.append(
                $('<option>').val('').text('Error loading sessions')
            );
            })
            .always(function() {
            sessionSelect.prop('disabled', false);
            });
        }

        $('#date_field').on('change', function() {
        var d = $(this).val();
        if (d) {
            history.replaceState({}, '', '?date=' + encodeURIComponent(d));
            updateSessions(d);
        } else {
            $('#session_field')
            .prop('disabled', true)
            .empty()
            .append($('<option>').val('').text('Select date first'));
        }
    });



    // Check if date is already set on page load (e.g., form validation failed and page reloaded)
    var initialDate = $('#date_field').val();
    if (initialDate) {
        updateSessions(initialDate);
    } else {
        $('#session_field').prop('disabled', true);
        if ($('#session_field option').length === 0) {
            $('#session_field').append(
                $('<option></option>')
                    .val('')
                    .text('Select a date first')
            );
        }
    }
});
</script>
{% endblock scripts %}
